[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manuscriptfinesse"
version = "1.0.0"
description = "A 6-Stage AI Fiction Book Generation Suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "ebooklib>=0.18",
    "python-docx>=1.0.0"
]

[project.scripts]
mf = "manuscriptfinesse.cli.main:app"
